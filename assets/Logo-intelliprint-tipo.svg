<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <!-- Background -->
  <rect x="10" y="10" width="900" height="260" rx="36" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>

  <!-- Typography: Intelli (Light) + Print (Heavy) -->
  <text x="60" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="112">
    <tspan font-weight="300" fill="#FFFFFF" letter-spacing="2">Intelli</tspan><tspan font-weight="700" fill="#00A3FF" letter-spacing="-1">Print</tspan>
  </text>
  <text x="64" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="24" fill="#94A3B8" letter-spacing="4">PREPRESS PRECISION ENGINE · ISO 12647</text>

  <!-- CMYK Accent Dots -->
  <circle cx="720" cy="207" r="6" fill="#00A3FF"/>
  <circle cx="744" cy="207" r="6" fill="#FF006E"/>
  <circle cx="768" cy="207" r="6" fill="#F5EE00"/>
  <circle cx="792" cy="207" r="6" fill="#FFFFFF"/>
</svg>

